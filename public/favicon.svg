  <path d="M14 36 C13.5 36 13 36.5 13.5 37.5 C14 38.5 14.5 38.5 15.5 39 C16.5 39.5 18 39 19.5 39.5 C21 40 23 39.5 25 40 C27 40.5 30 40 33 40.5 C36 41 39 40 42 40.5 C45 41 47.5 39.5 49 39 C50 38.5 50.5 37.5 50 36.8 C49.5 36 48.5 36 47 36 Z" fill="url(#cravPattyGrad)" />

